<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Exam Interface</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/startexam.css" />
  <style>
    /* --- STICKY MONITORING CSS --- */
    .exam-container {
        display: flex;
        gap: 30px;
        align-items: flex-start; /* Required for sticky to work */
        padding: 20px;
        max-width: 1400px;
        margin: 0 auto;
    }

    .exam-questions {
        flex: 3; /* Takes 75% width */
    }

    .exam-monitoring {
        flex: 1; /* Takes 25% width */
        position: sticky; /* ✨ MAKES IT STAY WHILE SCROLLING */
        top: 20px;       /* Distance from top of screen */
        background: #1e253f;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        height: fit-content;
    }

    /* Webcam Styling */
    .video-wrapper {
        width: 100%;
        position: relative;
        border-radius: 8px;
        overflow: hidden;
        background: #000;
        aspect-ratio: 4/3;
    }

    #webcam {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .recording-indicator {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(220, 38, 38, 0.8);
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    /* Guidelines Styling */
    .exam-guidelines {
        background-color: #2d3748;
        padding: 15px 20px;
        margin: 20px auto;
        max-width: 1400px;
        border-radius: 8px;
        border-left: 4px solid #3b82f6;
    }
  </style>
</head>
<body>
  <nav class="nav-bar">
    <h1><i class="fa-solid fa-brain"></i> Online Exam</h1>
    <div class="nav-buttons">
      <span id="username"><i class="fa-solid fa-user-graduate"></i> Student</span>
      <button onclick="logout()" class="btn-logout">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>
  </nav>

  <div class="exam-guidelines">
    <h3><i class="fa-solid fa-circle-exclamation"></i> Guidelines</h3>
    <ul>
      <li><i class="fa-solid fa-check"></i> Don't switch the tab or the exam will be submitted automatically.</li>
      <li><i class="fa-solid fa-check"></i> Ensure you're alone in the room.</li>
      <li><i class="fa-solid fa-check"></i> Do not switch tabs or use external devices.</li>
      <li><i class="fa-solid fa-check"></i> Keep your face visible at all times.</li>
    </ul>
  </div>

  <div class="exam-container">
    <section class="exam-questions">
      <h2><i class="fa-solid fa-file-lines"></i> Exam Questions</h2>
      <div id="question-list">
        <p class="placeholder"><i class="fa-solid fa-spinner fa-spin"></i> Loading questions...</p>
      </div>
    </section>

    <section class="exam-monitoring">
      <h2><i class="fa-solid fa-video"></i> Webcam Monitoring</h2>
      <div class="video-wrapper">
        <video id="webcam" autoplay muted playsinline></video>
        <div class="recording-indicator"><i class="fa-solid fa-circle"></i> Live</div>
      </div>
      </section>
  </div>

  <script src="js/startexam.js"></script>
</body>
</html>
