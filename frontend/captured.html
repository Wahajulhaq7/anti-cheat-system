<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Unusual Detections - Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Specific style for table thumbnail images */
    img.detection-img {
      width: 100px;
      height: 60px;
      object-fit: cover;
      border-radius: 5px;
      border: 1px solid #4a5568;
    }

    /* --- BUTTON STYLES --- */
    .btn-delete {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
      transition: background 0.2s;
    }
    .btn-delete:hover { background-color: #dc2626; }

    .btn-view {
      background-color: #3b82f6; /* Blue */
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
      margin-right: 8px; /* Space between buttons */
      transition: background 0.2s;
    }
    .btn-view:hover { background-color: #2563eb; }

    /* --- MODAL STYLES (Centered & Medium Size) --- */
    .modal {
        display: none; /* Hidden by default */
        position: fixed;
        z-index: 2000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85); /* Dark overlay */
        backdrop-filter: blur(4px);
        align-items: center;
        justify-content: center;
    }

    .modal-content {
        position: relative;
        background-color: #1a202c;
        padding: 10px;
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        max-width: 600px; /* Medium Size */
        width: 90%;
        text-align: center;
        animation: zoomIn 0.2s ease-out;
    }

    @keyframes zoomIn {
        from { transform: scale(0.9); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    .modal-content img {
        width: 100%;
        height: auto;
        border-radius: 4px;
        display: block;
    }

    .close-btn {
        position: absolute;
        top: -35px;
        right: 0;
        color: #fff;
        font-size: 30px;
        font-weight: bold;
        cursor: pointer;
        transition: color 0.2s;
    }
    .close-btn:hover { color: #ef4444; }

  </style>
</head>
<body>

  <nav class="navbar">
    <div class="brand">
      <i class="fa-solid fa-shield-halved"></i> Anti-Cheat Exam System
    </div>
    <div class="nav-links">
      <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a href="report.html"><i class="fa-solid fa-file-invoice"></i> Reports</a>
      <a href="manage_adminexam.html"><i class="fa-solid fa-file-circle-plus"></i> Exams</a>
      <a href="captured.html" class="active"><i class="fa-solid fa-camera"></i> Detections</a>
      <button onclick="logout()" class="logout-btn">Logout</button>
    </div>
  </nav>

  <div class="main-content">
    
    <div class="dashboard-banner">
      <h2><i class="fa-solid fa-camera"></i> Unusual Detections</h2>
      <p>Monitor captured frames where unusual activity was detected.</p>
    </div>

    <div class="table-container">
      <div class="table-header">
        <h3><i class="fa-solid fa-list"></i> Detections Log</h3>
      </div>

      <table id="detectionsTable">
        <thead>
          <tr>
            <th>Frame</th>
            <th>Student</th>
            <th>Exam ID</th>
            <th>Type</th>
            <th>Timestamp</th>
            <th>Action</th> 
          </tr>
        </thead>
        <tbody>
          </tbody>
      </table>
    </div>

  </div>

  <div id="imageModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <img id="modalImage" src="" alt="Evidence Frame">
    </div>
  </div>

  <script src="js/captured.js"></script>
</body>
</html>
