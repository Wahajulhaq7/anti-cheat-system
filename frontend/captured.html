<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Unusual Detections - Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* Specific style for detection images that isn't in global css */
    img.detection-img {
      width: 100px;
      height: 60px;
      object-fit: cover;
      border-radius: 5px;
      border: 1px solid #4a5568;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="brand">
      <i class="fa-solid fa-shield-halved"></i> Anti-Cheat Exam System
    </div>
    <div class="nav-links">
      <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a href="report.html"><i class="fa-solid fa-file-invoice"></i> Reports</a>
      <a href="manage_adminexam.html"><i class="fa-solid fa-file-circle-plus"></i> Exams</a>
      <a href="captured.html" class="active"><i class="fa-solid fa-camera"></i> Detections</a>
      <button onclick="logout()" class="logout-btn">Logout</button>
    </div>
  </nav>

  <div class="main-content">
    
    <div class="dashboard-banner">
      <h2><i class="fa-solid fa-camera"></i> Unusual Detections</h2>
      <p>Monitor captured frames where unusual activity was detected.</p>
    </div>

    <div class="table-container">
      <div class="table-header">
        <h3><i class="fa-solid fa-list"></i> Detections Log</h3>
      </div>

      <table id="detectionsTable">
        <thead>
          <tr>
            <th>Frame</th>
            <th>Student</th>
            <th>Exam ID</th>
            <th>Type</th>
            <th>Timestamp</th>
          </tr>
        </thead>
        <tbody>
          </tbody>
      </table>
    </div>

  </div>

  <script src="js/captured.js"></script>
</body>
</html>
