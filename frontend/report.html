<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reports - Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="brand">
      <i class="fa-solid fa-shield-halved"></i> Anti-Cheat Exam System
    </div>
    <div class="nav-links">
      <a href="dashboard.html"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
    </div>
  </nav>

  <div class="main-content">
    
    <div class="dashboard-banner" style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h2><i class="fa-solid fa-file-invoice-dollar"></i> Cheating Reports</h2>
        <p>View and analyze student exam reports.</p>
      </div>
      <button onclick="fetchReports()" class="btn-create" style="width: auto;">
        <i class="fa-solid fa-rotate-right"></i> Load All Reports
      </button>
    </div>

    <div class="table-container">
      <div class="table-header">
        <h3><i class="fa-solid fa-list"></i> Student Reports</h3>
      </div>

      <table id="reportsTable">
        <thead>
          <tr>
            <th>Student ID</th>
            <th>Student Name</th>
            <th>Exam ID</th>
            <th>Exam Title</th>
            <th>Date</th>
            <th>Risk Score</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="reportsBody">
          </tbody>
      </table>
    </div>

  </div>
  <div id="imageModal" class="modal" style="display: none;">
  <div class="modal-content">
    <div class="modal-header">
      <h2><i class="fa-solid fa-images"></i> Select Evidence Images</h2>
      <span class="close-btn" onclick="closeImageModal()">&times;</span>
    </div>
    
    <p class="modal-instruction">Click on the images you want to include in the PDF report.</p>
    
    <div id="imageGrid" class="image-grid">
       </div>

    <div class="modal-footer">
      <span id="selectionCount">0 images selected</span>
      <button id="btnGenerateWithImages" class="btn-create" onclick="generateCustomPDF()">
        <i class="fa-solid fa-file-pdf"></i> Generate Report
      </button>
    </div>
  </div>
</div>

<script src="js/report.js"></script>
</body>
</html>
