<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student List</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/students.css" />
</head>
<body>
  
<nav class="nav-bar">
  <h1><i class="fa-solid fa-users"></i> All Students</h1>
  
  <button onclick="goBack()" class="btn-back-nav">
    <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
  </button>
</nav>

<div class="container">
  
  <div class="content-card">
    <div class="header-row">
      <h2><i class="fa-solid fa-user-graduate"></i> Registered Students</h2>
      <p>Total: <strong id="totalStudents">0</strong></p>
    </div>

    <table id="studentsTable" class="students-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Role</th>
          </tr>
      </thead>
      <tbody>
        <tr><td colspan="3" class="placeholder">Loading students...</td></tr>
      </tbody>
    </table>
  </div>
</div>

  <script src="js/students.js"></script>
</body>
</html>
