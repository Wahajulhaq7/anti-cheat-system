<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student List</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/invigilator.css" /> 
  <link rel="stylesheet" href="css/students.css" /> 
  <style>
    /* --- SEARCH BAR CSS --- */
    .search-container {
        display: flex;
        justify-content: center;
        margin-bottom: 25px;
        position: relative;
        width: 100%;
    }

    .search-wrapper {
        position: relative;
        width: 50%; /* Adjust width as needed */
        max-width: 500px;
    }

    .search-wrapper i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #a0aec0;
    }

    #searchInput {
        width: 100%;
        padding: 12px 20px 12px 45px; /* Left padding for icon */
        border-radius: 25px;
        border: 1px solid #4a5568;
        background-color: #1a202c; /* Darker background for input */
        color: #e2e8f0;
        font-size: 15px;
        outline: none;
        transition: all 0.3s ease;
    }

    #searchInput:focus {
        border-color: #5840d8;
        box-shadow: 0 0 0 3px rgba(88, 64, 216, 0.3);
    }

    #searchInput::placeholder {
        color: #718096;
    }

    /* --- Modal & Button CSS (Existing) --- */
    .modal { 
        display: none; 
        position: fixed; 
        z-index: 2000; 
        left: 0; 
        top: 0; 
        width: 100%; 
        height: 100%; 
        background-color: rgba(0,0,0,0.6); 
        justify-content: center; 
        align-items: center; 
        backdrop-filter: blur(3px); 
    }
    .modal-content { 
        background-color: #fefefe; 
        margin: auto; 
        padding: 0; 
        border-radius: 8px; 
        width: 400px; 
        text-align: center; 
        position: relative; 
        overflow: hidden; 
        display: flex; 
        flex-direction: column; 
    }
    .card-header-modal { 
        background: #5840d8; 
        color: white; 
        padding: 20px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        width: 100%; 
    }
    .card-header-modal h3 { 
        margin: 0; 
        font-size: 18px; 
        font-weight: 600; 
        display: flex; 
        align-items: center; 
        gap: 10px; 
    }
    .modal-body { 
        padding: 25px; 
        width: 100%; 
        background: #fff; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
    }
    .modal-body p { 
        color: #4a5568; 
        font-size: 16px; 
        margin-bottom: 25px; 
        text-align: center; 
        width: 100%; 
    }
    .modal-actions { 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        gap: 15px; 
        width: 100%; 
        margin-top: 10px; 
    }
    .btn-confirm-logout { 
        background-color: #5840d8; 
        color: white; 
        border: none; 
        padding: 0; 
        border-radius: 6px; 
        cursor: pointer; 
        width: 130px; 
        height: 40px; 
        font-weight: 600; 
        font-size: 14px;
        display: flex; 
        justify-content: center; 
        align-items: center; 
        text-align: center;
        transition: background 0.2s; 
    }
    .btn-confirm-logout:hover { background-color: #4c35de; }
    .btn-cancel { 
        background-color: #6c757d; 
        color: white; 
        border: none; 
        padding: 0; 
        border-radius: 6px; 
        cursor: pointer; 
        width: 130px; 
        height: 40px; 
        font-weight: 600; 
        font-size: 14px;
        display: flex; 
        justify-content: center; 
        align-items: center; 
        text-align: center;
        transition: background 0.2s; 
    }
    .btn-cancel:hover { background-color: #5a6268; }
  </style>
</head>
<body>
  
<nav class="nav-bar">
  <h1><i class="fa-solid fa-user-secret"></i> Invigilator Dashboard</h1>
  <div class="nav-buttons">
    <button onclick="location.href='invigilator.html'" class="btn-nav">
      <i class="fa-solid fa-gauge"></i> Dashboard
    </button>

    <button onclick="location.href='students.html'" class="btn-nav active" style="color: #fff; background-color: rgba(255, 255, 255, 0.1);">
      <i class="fa-solid fa-users"></i> Students
    </button>
    <button onclick="location.href='manage_exams.html'" class="btn-nav">
      <i class="fa-solid fa-file-lines"></i> Exams Created
    </button>
    <button onclick="location.href='submitted_exams.html'" class="btn-nav">
      <i class="fa-solid fa-clipboard-check"></i> Submitted Exams
    </button>
    <button onclick="location.href='invigilator_reports.html'" class="btn-nav">
      <i class="fa-solid fa-inbox"></i> Received Reports
    </button>
    <button onclick="location.href='unusual.html'" class="btn-nav">
      <i class="fa-solid fa-triangle-exclamation"></i> Unusual Detections
    </button>
    
    <div class="user-menu">
      <span id="username"><i class="fa-solid fa-user"></i> Invigilator</span>
      <button onclick="openLogoutModal()" class="btn-logout">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>
  </div>
</nav>

<div class="container" style="margin-top: 20px;">
  <div class="content-card">
    <div class="header-row">
      <h2><i class="fa-solid fa-user-graduate"></i> Registered Students</h2>
      <p>Total: <strong id="totalStudents">0</strong></p>
    </div>

    <div class="search-container">
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search by ID or Username..." onkeyup="filterStudents()">
        </div>
    </div>

    <table id="studentsTable" class="students-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Username</th>
          <th>Role</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="3" class="placeholder">Loading students...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="logoutModal" class="modal">
  <div class="modal-content">
    <div class="card-header-modal">
      <h3><i class="fa-solid fa-right-from-bracket"></i> Confirm Logout</h3>
    </div>
    <div class="modal-body">
      <p>Are you sure you want to log out?</p>
      <div class="modal-actions">
        <button onclick="confirmLogout()" class="btn-confirm-logout">Yes, Logout</button>
        <button onclick="closeLogoutModal()" class="btn-cancel">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script src="js/students.js"></script>
<script>
  // Common Navbar Logic
  const username = localStorage.getItem('username') || 'Invigilator';
  const usernameEl = document.getElementById('username');
  if (usernameEl) usernameEl.innerHTML = `<i class="fa-solid fa-user"></i> ${username}`;

  // Logout Logic
  function openLogoutModal() { document.getElementById('logoutModal').style.display = 'flex'; }
  function closeLogoutModal() { document.getElementById('logoutModal').style.display = 'none'; }
  function confirmLogout() { localStorage.clear(); window.location.href = 'login.html'; }
  
  window.onclick = function(event) {
    const logoutModal = document.getElementById('logoutModal');
    if (event.target == logoutModal) closeLogoutModal();
  }
</script>
</body>
</html>
