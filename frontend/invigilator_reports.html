<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Received Reports - Invigilator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/invigilator.css"> 
  <style>
    /* Table & Page specific styles */
    .table-container {
        background-color: #1e253f;
        border-radius: 8px;
        padding: 20px;
        margin-top: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        text-align: left;
        color: #a0aec0;
        font-size: 13px;
        padding: 15px;
        border-bottom: 1px solid #4a5568;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    td {
        padding: 15px;
        border-bottom: 1px solid #2d3748;
        color: #e2e8f0;
        font-size: 14px;
        vertical-align: middle;
    }

    tr:hover {
        background-color: rgba(255, 255, 255, 0.05);
    }

    .btn-download {
        background-color: #5840d8;
        color: white;
        text-decoration: none;
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: background 0.2s;
    }
    .btn-download:hover {
        background-color: #4c35de;
    }

    /* --- NEW SEARCH BAR STYLES --- */
    .search-container {
        margin-bottom: 0;
        display: flex;
        justify-content: flex-start;
        align-items: center;
    }

    .search-box {
        background-color: #1e253f;
        border: 1px solid #4a5568;
        border-radius: 6px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        width: 100%;
        max-width: 350px; /* Keeps it compact */
        transition: border-color 0.2s;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .search-box:focus-within {
        border-color: #5840d8;
    }

    .search-box i {
        color: #a0aec0;
        margin-right: 10px;
        font-size: 14px;
    }

    .search-input {
        background: transparent;
        border: none;
        outline: none;
        color: #e2e8f0;
        width: 100%;
        font-size: 14px;
    }

    .search-input::placeholder {
        color: #718096;
    }

    /* --- MODAL STYLES (Consistent) --- */
    .modal { 
        display: none; 
        position: fixed; 
        z-index: 2000; 
        left: 0; 
        top: 0; 
        width: 100%; 
        height: 100%; 
        background-color: rgba(0,0,0,0.6); 
        justify-content: center; 
        align-items: center; 
        backdrop-filter: blur(3px); 
    }
    
    .modal-content { 
        background-color: #fefefe; 
        margin: auto; 
        padding: 0; 
        border-radius: 8px; 
        width: 400px; 
        text-align: center; 
        position: relative; 
        overflow: hidden; 
        display: flex; 
        flex-direction: column; 
    }
    
    .card-header-modal { 
        background: #5840d8; 
        color: white; 
        padding: 20px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        width: 100%; 
    }
    
    .card-header-modal h3 { 
        margin: 0; 
        font-size: 18px; 
        font-weight: 600; 
        display: flex; 
        align-items: center; 
        gap: 10px; 
    }
    
    .modal-body { 
        padding: 25px; 
        width: 100%; 
        background: #fff; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
    }
    
    .modal-body p { 
        color: #4a5568; 
        font-size: 16px; 
        margin-bottom: 25px; 
        text-align: center; 
        width: 100%; 
    }
    
    .modal-actions { 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        gap: 15px; 
        width: 100%; 
        margin-top: 10px; 
    }
    
    /* Buttons - Centering Fix */
    .btn-confirm-logout { 
        background-color: #5840d8; 
        color: white; 
        border: none; 
        padding: 0; 
        border-radius: 6px; 
        cursor: pointer; 
        width: 130px; 
        height: 40px; 
        font-weight: 600; 
        font-size: 14px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        transition: background 0.2s; 
    }
    .btn-confirm-logout:hover { background-color: #4c35de; }

    .btn-cancel { 
        background-color: #6c757d; 
        color: white; 
        border: none; 
        padding: 0; 
        border-radius: 6px; 
        cursor: pointer; 
        width: 130px; 
        height: 40px; 
        font-weight: 600; 
        font-size: 14px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        transition: background 0.2s; 
    }
    .btn-cancel:hover { background-color: #5a6268; }
  </style>
</head>
<body>

    <nav class="nav-bar">
      <h1><i class="fa-solid fa-user-secret"></i> Invigilator Dashboard</h1>
      <div class="nav-buttons">
        <button onclick="location.href='invigilator.html'" class="btn-nav">
          <i class="fa-solid fa-gauge"></i> Dashboard
        </button>
        <button onclick="location.href='students.html'" class="btn-nav">
          <i class="fa-solid fa-users"></i> Students
        </button>
        <button onclick="location.href='manage_exams.html'" class="btn-nav">
          <i class="fa-solid fa-file-lines"></i> Exams Created
        </button>
        <button onclick="location.href='submitted_exams.html'" class="btn-nav">
          <i class="fa-solid fa-clipboard-check"></i> Submitted Exams
        </button>
        <button onclick="location.href='invigilator_reports.html'" class="btn-nav active" style="color: #fff; background-color: rgba(255, 255, 255, 0.1);">
          <i class="fa-solid fa-inbox"></i> Received Reports
        </button>
        <button onclick="location.href='unusual.html'" class="btn-nav">
          <i class="fa-solid fa-triangle-exclamation"></i> Unusual Detections
        </button>
        
        <div class="user-menu">
          <span id="username"><i class="fa-solid fa-user"></i> Invigilator</span>
          <button onclick="openLogoutModal()" class="btn-logout">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
          </button>
        </div>
      </div>
    </nav>

    <div class="dashboard-container">
        <section>
            <h2><i class="fa-solid fa-inbox"></i> Received Reports</h2>
            <p style="color: #a0aec0; margin-bottom: 20px;">Reports sent by Admin regarding suspicious student activities.</p>
            
            <div class="search-container">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search by Student, Exam or ID...">
                </div>
            </div>

            <div class="table-container">
                <table id="reportsTable">
                    <thead>
                        <tr>
                            <th>Date Received</th>
                            <th>Student Info</th>
                            <th>Exam</th>
                            <th>Sent By</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="reportsBody">
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <div id="logoutModal" class="modal">
      <div class="modal-content">
        <div class="card-header-modal">
          <h3><i class="fa-solid fa-right-from-bracket"></i> Confirm Logout</h3>
        </div>
        <div class="modal-body">
          <p>Are you sure you want to log out?</p>
          <div class="modal-actions">
            <button onclick="confirmLogout()" class="btn-confirm-logout">Yes, Logout</button>
            <button onclick="closeLogoutModal()" class="btn-cancel">Cancel</button>
          </div>
        </div>
      </div>
    </div>

    <script>
        const token = localStorage.getItem("token");
        const role = (localStorage.getItem('role') || '').toLowerCase();
        const username = localStorage.getItem('username') || 'Invigilator';
        
        // Global variable to store data for filtering
        let allReports = [];

        if (!token || role !== 'invigilator') {
            window.location.href = "login.html";
        }

        // Set username
        const usernameEl = document.getElementById('username');
        if(usernameEl) usernameEl.innerHTML = `<i class="fa-solid fa-user"></i> ${username}`;

        // --- Logout Modal Logic ---
        function openLogoutModal() { document.getElementById('logoutModal').style.display = 'flex'; }
        function closeLogoutModal() { document.getElementById('logoutModal').style.display = 'none'; }
        function confirmLogout() { localStorage.clear(); window.location.href = 'login.html'; }

        window.onclick = function(event) {
          const logoutModal = document.getElementById('logoutModal');
          if (event.target == logoutModal) closeLogoutModal();
        }

        // --- Fetch Data ---
        async function loadReports() {
            const tbody = document.getElementById("reportsBody");
            tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; padding: 20px;'>Loading...</td></tr>";

            try {
                const res = await fetch("http://localhost:8000/log/reports/received", {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (!res.ok) throw new Error("Failed to fetch reports");

                const reports = await res.json();
                
                // Store fetched data globally
                allReports = reports;

                // Render all data initially
                renderTable(allReports);

            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan='5' style="color:#ef4444; text-align:center; padding:20px;">Error: ${err.message}</td></tr>`;
            }
        }

        // --- Render Table Function ---
        function renderTable(data) {
            const tbody = document.getElementById("reportsBody");
            tbody.innerHTML = "";

            if (data.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; padding: 20px; color: #a0aec0;'>No matching reports found.</td></tr>";
                return;
            }

            data.forEach(r => {
                const date = new Date(r.sent_at).toLocaleString();
                const downloadLink = `http://localhost:8000/uploaded_reports/${r.report_file_path}`;

                const row = `
                    <tr>
                        <td>${date}</td>
                        <td>
                            <strong style="color:white;">${r.student_name}</strong><br>
                            <span style="font-size:0.85em; color:#a0aec0;">ID: ${r.student_id}</span>
                        </td>
                        <td>
                            <strong style="color:white;">${r.exam_title}</strong><br>
                            <span style="font-size:0.85em; color:#a0aec0;">ID: ${r.exam_id}</span>
                        </td>
                        <td>Admin: ${r.sender_name}</td>
                        <td>
                            <a href="${downloadLink}" target="_blank" class="btn-download">
                                <i class="fa-solid fa-download"></i> Download PDF
                            </a>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // --- Search/Filter Logic ---
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase().trim();
            
            const filteredData = allReports.filter(r => {
                // Convert IDs to string for comparison
                const sName = (r.student_name || "").toLowerCase();
                const eTitle = (r.exam_title || "").toLowerCase();
                const sId = String(r.student_id || "");
                const eId = String(r.exam_id || "");

                return sName.includes(searchTerm) || 
                       eTitle.includes(searchTerm) || 
                       sId.includes(searchTerm) || 
                       eId.includes(searchTerm);
            });

            renderTable(filteredData);
        });

        loadReports();
    </script>
</body>
</html>
