<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Anti-Cheat System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="brand">
      <i class="fa-solid fa-shield-halved"></i> Anti-Cheat Exam System
    </div>
  </nav>

  <div class="main-container">
    <div class="login-card">
      
      <div class="card-header">
        <h3><i class="fa-solid fa-arrow-right-to-bracket"></i> Login</h3>
      </div>

      <div class="card-body">
        <form id="loginForm">
          
          <div class="input-group">
            <label for="username">Username</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-user input-icon"></i>
              <input type="text" id="username" placeholder="Enter Username" required />
            </div>
          </div>

          <div class="input-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <i class="fa-solid fa-lock input-icon"></i>
              <input type="password" id="password" placeholder="Enter Password" required />
              <span class="password-toggle" onclick="togglePassword()">
                <i class="fa-solid fa-eye"></i>
              </span>
            </div>
          </div>

          <button type="submit" class="login-btn">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
          </button>

          <div id="login-error-box" class="error-box"></div>

        </form>

        <div class="info-box">
          <p class="info-title"><i class="fa-solid fa-circle-info"></i> Login Information:</p>
          <ul>
            <li>For Admin: Use your provided admin credentials</li>
            <li>For Students: Use your Name and assigned password</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script> 
  <script>
    // Toggle password visibility
    function togglePassword() {
      const passwordInput = document.getElementById("password");
      const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
      passwordInput.setAttribute("type", type);
    }
  </script>
</body>
</html>
