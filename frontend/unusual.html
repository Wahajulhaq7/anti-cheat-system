<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unusual Detections</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/invigilator.css" />
</head>
<body>

  <nav class="nav-bar">
    <h1><i class="fa-solid fa-triangle-exclamation"></i> Unusual Detections</h1>
    <div class="nav-buttons">
      <button onclick="location.href='invigilator.html'" class="btn-nav">
        <i class="fa-solid fa-house"></i> Dashboard
      </button>
      
      <div class="user-menu">
        <span id="username"><i class="fa-solid fa-user"></i> Invigilator</span>
        <button onclick="logout()" class="btn-logout">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="dashboard-container">
    <section>
      <h2><i class="fa-solid fa-camera-retro"></i> All Flagged Activities</h2>
      <div id="detections-container" class="detections-grid">
        <p class="placeholder"><i class="fa-solid fa-spinner fa-spin"></i> Loading detections...</p>
      </div>
    </section>
  </div>

  <script src="js/unusual.js"></script>
  <script>
    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
