<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unusual Detections</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/invigilator.css" />
  <style>
    /* --- MODAL STYLES (Consistent) --- */
    .modal { 
        display: none; 
        position: fixed; 
        z-index: 2000; 
        left: 0; 
        top: 0; 
        width: 100%; 
        height: 100%; 
        background-color: rgba(0,0,0,0.6); 
        justify-content: center; 
        align-items: center; 
        backdrop-filter: blur(3px); 
    }
    
    .modal-content { 
        background-color: #fefefe; 
        margin: auto; 
        padding: 0; 
        border-radius: 8px; 
        width: 400px; 
        text-align: center; 
        position: relative; 
        overflow: hidden; 
        display: flex; 
        flex-direction: column; 
    }

    /* --- Image Modal Specific Override --- */
    #imageModal .modal-content {
        width: 80%;
        max-width: 800px; /* Wider for image viewing */
    }

    #modalImage {
        width: 100%;
        max-height: 60vh;
        object-fit: contain;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-bottom: 15px;
        background: #000;
    }
    
    /* Header Styles */
    .card-header-modal { 
        background: #5840d8; 
        color: white; 
        padding: 20px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        width: 100%; 
    }
    
    .card-header-modal h3 { 
        margin: 0; 
        font-size: 18px; 
        font-weight: 600; 
        display: flex; 
        align-items: center; 
        gap: 10px; 
    }
    
    .modal-body { 
        padding: 25px; 
        width: 100%; 
        background: #fff; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
    }
    
    .modal-body p { 
        color: #4a5568; 
        font-size: 16px; 
        margin-bottom: 25px; 
        text-align: center; 
        width: 100%; 
    }
    
    .modal-actions { 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        gap: 15px; 
        width: 100%; 
        margin-top: 10px; 
    }
    
    /* Buttons - Centering Fix */
    .btn-confirm-logout { 
        background-color: #5840d8; 
        color: white; 
        border: none; 
        padding: 0; 
        border-radius: 6px; 
        cursor: pointer; 
        width: 130px; 
        height: 40px; 
        font-weight: 600; 
        font-size: 14px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        transition: background 0.2s; 
    }
    .btn-confirm-logout:hover { background-color: #4c35de; }

    .btn-cancel { 
        background-color: #6c757d; 
        color: white; 
        border: none; 
        padding: 0; 
        border-radius: 6px; 
        cursor: pointer; 
        width: 130px; 
        height: 40px; 
        font-weight: 600; 
        font-size: 14px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        transition: background 0.2s; 
    }
    .btn-cancel:hover { background-color: #5a6268; }
  </style>
</head>
<body>

<nav class="nav-bar">
  <h1><i class="fa-solid fa-user-secret"></i> Invigilator Dashboard</h1>
  <div class="nav-buttons">
    <button onclick="location.href='invigilator.html'" class="btn-nav">
      <i class="fa-solid fa-gauge"></i> Dashboard
    </button>
    <button onclick="location.href='students.html'" class="btn-nav">
      <i class="fa-solid fa-users"></i> Students
    </button>
    <button onclick="location.href='manage_exams.html'" class="btn-nav">
      <i class="fa-solid fa-file-lines"></i> Exams Created
    </button>
    <button onclick="location.href='submitted_exams.html'" class="btn-nav">
      <i class="fa-solid fa-clipboard-check"></i> Submitted Exams
    </button>
    <button onclick="location.href='invigilator_reports.html'" class="btn-nav">
      <i class="fa-solid fa-inbox"></i> Received Reports
    </button>
    <button onclick="location.href='unusual.html'" class="btn-nav active" style="color: #fff; background-color: rgba(255, 255, 255, 0.1);">
      <i class="fa-solid fa-triangle-exclamation"></i> Unusual Detections
    </button>
    
    <div class="user-menu">
      <span id="username"><i class="fa-solid fa-user"></i> Invigilator</span>
      <button onclick="openLogoutModal()" class="btn-logout">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>
  </div>
</nav>

<div class="dashboard-container">
  <section>
    <h2><i class="fa-solid fa-camera-retro"></i> All Flagged Activities</h2>
    <div id="detections-container" class="detections-grid">
      <p class="placeholder"><i class="fa-solid fa-spinner fa-spin"></i> Loading detections...</p>
    </div>
  </section>
</div>

<div id="logoutModal" class="modal">
  <div class="modal-content">
    <div class="card-header-modal">
      <h3><i class="fa-solid fa-right-from-bracket"></i> Confirm Logout</h3>
    </div>
    <div class="modal-body">
      <p>Are you sure you want to log out?</p>
      <div class="modal-actions">
        <button onclick="confirmLogout()" class="btn-confirm-logout">Yes, Logout</button>
        <button onclick="closeLogoutModal()" class="btn-cancel">Cancel</button>
      </div>
    </div>
  </div>
</div>

<div id="imageModal" class="modal">
  <div class="modal-content">
    <div class="card-header-modal">
      <h3><i class="fa-solid fa-eye"></i> Captured Frame</h3>
    </div>
    <div class="modal-body">
      <img id="modalImage" src="" alt="Evidence Image">
      <div class="modal-actions">
        <button onclick="closeImageModal()" class="btn-cancel" style="width: 100px;">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="js/unusual.js"></script>
<script>
  // Navbar Logic
  const username = localStorage.getItem('username') || 'Invigilator';
  const usernameEl = document.getElementById('username');
  if (usernameEl) usernameEl.innerHTML = `<i class="fa-solid fa-user"></i> ${username}`;

  // --- Logout Modal Logic ---
  function openLogoutModal() { document.getElementById('logoutModal').style.display = 'flex'; }
  function closeLogoutModal() { document.getElementById('logoutModal').style.display = 'none'; }
  function confirmLogout() { localStorage.clear(); window.location.href = 'login.html'; }

  // --- Image Modal Logic (Called by js/unusual.js) ---
  function openImageModal(imageUrl) {
    const modal = document.getElementById('imageModal');
    const img = document.getElementById('modalImage');
    img.src = imageUrl;
    modal.style.display = 'flex';
  }

  function closeImageModal() {
    document.getElementById('imageModal').style.display = 'none';
    document.getElementById('modalImage').src = ""; // Clear src
  }

  // Close modals on outside click
  window.onclick = function(event) {
    const logoutModal = document.getElementById('logoutModal');
    const imageModal = document.getElementById('imageModal');
    
    if (event.target == logoutModal) closeLogoutModal();
    if (event.target == imageModal) closeImageModal();
  }
</script>
</body>
</html>
