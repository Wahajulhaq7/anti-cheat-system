<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submitted Exams</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/invigilator.css">
  <style>
    /* Table specific styles for Submitted Exams */
    .table-container {
        background-color: #1e253f;
        border-radius: 8px;
        padding: 20px;
        margin-top: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        text-align: left;
        color: #a0aec0;
        font-size: 13px;
        padding: 15px;
        border-bottom: 1px solid #4a5568;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    td {
        padding: 15px;
        border-bottom: 1px solid #2d3748;
        color: #e2e8f0;
        font-size: 14px;
        vertical-align: middle;
    }

    tr:hover {
        background-color: rgba(255, 255, 255, 0.05);
    }

    .btn-view {
        background-color: transparent;
        border: 1px solid #3b82f6; /* Blue border */
        color: #3b82f6;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 6px;
        width: fit-content;
    }

    .btn-view:hover {
        background-color: rgba(59, 130, 246, 0.15);
    }

    .placeholder {
        text-align: center;
        color: #a0aec0;
        font-style: italic;
        padding: 30px;
    }
  </style>
</head>
<body>

  <nav class="nav-bar">
    <h1><i class="fa-solid fa-clipboard-check"></i> Submitted Exams</h1>
    <div class="nav-buttons">
      <button onclick="window.location.href='invigilator.html'" class="btn-nav">
        <i class="fa-solid fa-house"></i> Dashboard
      </button>
      <button onclick="window.location.href='manage_exams.html'" class="btn-nav">
        <i class="fa-solid fa-file-lines"></i> Exams Created
      </button>
      
      <div class="user-menu">
        <span id="username"><i class="fa-solid fa-user"></i> Invigilator</span>
        <button onclick="logout()" class="btn-logout">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="dashboard-container">
    <section>
        <h2><i class="fa-solid fa-list-check"></i> Student Submissions</h2>
        <div class="table-container">
            <table class="min-w-full">
                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Exam Title</th>
                        <th>Submission Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="submissionsBody">
                    </tbody>
            </table>
        </div>
    </section>
  </div>

  <script>
    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    function viewAnswers(examId, studentId) {
      if (!examId || !studentId) {
        alert("Invalid exam or student ID");
        return;
      }
      window.location.href = `view_answers.html?exam_id=${examId}&user_id=${studentId}`;
    }
  </script>

  <script src="js/submitted_exams.js"></script>
</body>
</html>
