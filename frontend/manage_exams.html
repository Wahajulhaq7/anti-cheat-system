<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Exams</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/invigilator.css" />
</head>
<body>
<nav class="nav-bar">
  <h1><i class="fa-solid fa-clipboard-list"></i> Manage Exams</h1>
  <div class="nav-buttons">
    <button onclick="window.location.href='invigilator.html'" class="btn-nav">
      <i class="fa-solid fa-house"></i> Dashboard
    </button>
    <button onclick="window.location.href='students.html'" class="btn-nav">
      <i class="fa-solid fa-users"></i> Students
    </button>
    
    <div class="user-menu">
      <span id="username"><i class="fa-solid fa-user"></i> Invigilator</span>
      <button onclick="logout()" class="btn-logout">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>
  </div>
</nav>

<div class="dashboard-container">
  <section class="exam-section">
    <h2><i class="fa-solid fa-layer-group"></i> My Created Exams</h2>
    <div id="examsList" class="exam-list">
      <p class="placeholder"><i class="fa-solid fa-spinner fa-spin"></i> Loading exams...</p>
    </div>
  </section>
</div>

<script>
const API_BASE = "http://localhost:8000"; 

window.onload = async () => {
  const token = localStorage.getItem('token');
  const role = (localStorage.getItem('role') || '').toLowerCase();
  const username = localStorage.getItem('username') || 'Invigilator';

  if (!token || role !== 'invigilator') {
    window.location.href = 'login.html';
    return;
  }

  // Update username text (keep the icon)
  const userSpan = document.getElementById('username');
  userSpan.innerHTML = `<i class="fa-solid fa-user"></i> ${username}`;
  
  await loadMyExams();
};

function logout() {
  localStorage.clear();
  window.location.href = 'login.html';
}

async function loadMyExams() {
  try {
    const token = localStorage.getItem('token');
    const res = await fetch(`${API_BASE}/exam/my`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (!res.ok) throw new Error('Failed to fetch your exams');

    const exams = await res.json();
    const list = document.getElementById('examsList');
    list.innerHTML = '';

    if (!exams.length) {
      list.innerHTML = '<p class="placeholder">No exams found.</p>';
      return;
    }

    exams.forEach(exam => {
      const createdAt = new Date(exam.created_at).toLocaleString();
      const div = document.createElement('div');
      div.className = 'exam-item';
      div.innerHTML = `
        <div class="exam-info">
          <strong>${exam.title}</strong>
          <p class="desc">${exam.description || 'No description provided.'}</p>
          <p class="meta"><i class="fa-regular fa-clock"></i> Created: ${createdAt}</p>
        </div>
        <div class="exam-actions">
           <button onclick="deleteExam(${exam.id})" class="btn-delete">
            <i class="fa-solid fa-trash"></i> Delete
          </button>
        </div>
      `;
      list.appendChild(div);
    });

  } catch (err) {
    console.error(err);
    document.getElementById('examsList').innerHTML = '<p class="placeholder">Error loading exams</p>';
  }
}

async function deleteExam(examId) {
  if (!confirm("Are you sure you want to delete this exam? This action cannot be undone.")) return;

  try {
    const token = localStorage.getItem('token');
    const res = await fetch(`${API_BASE}/exam/${examId}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (!res.ok) {
      const errData = await res.json();
      throw new Error(errData.detail || 'Failed to delete exam');
    }

    alert("✅ Exam deleted successfully");
    await loadMyExams();

  } catch (err) {
    console.error(err);
    alert("❌ " + err.message);
  }
}
</script>
</body>
</html>
