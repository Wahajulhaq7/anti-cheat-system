<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Exams - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/manage_adminexam.css">
    <style>
        /* --- MODAL STYLES (For Logout) --- */
        .modal {
            display: none; 
            position: fixed; 
            z-index: 1000; 
            left: 0; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0,0,0,0.6); 
            justify-content: center; 
            align-items: center;
            backdrop-filter: blur(2px);
        }
        
        .modal-content {
            background-color: #fff;
            margin: auto;
            padding: 0;
            border-radius: 8px;
            width: 400px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .card-header-modal { 
            background: #5840d8; 
            color: white; 
            padding: 20px; 
            text-align: center;
        }

        .card-header-modal h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }
        
        .modal-body { padding: 25px; text-align: center; background: #fff; }
        
        .modal-actions { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            margin-top: 10px; 
        }
        
        /* Button Sizing */
        .modal-actions button {
            width: 140px;
            padding: 12px 0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            transition: background-color 0.2s;
            color: white;
        }

        .btn-confirm-logout { background-color: #5840d8; }
        .btn-confirm-logout:hover { background-color: #4c35de; }

        .btn-cancel { background-color: #6c757d; }
        .btn-cancel:hover { background-color: #5a6268; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">
            <i class="fa-solid fa-shield-halved"></i> Anti-Cheat Exam System
        </div>
        <div class="nav-links">
            <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
            <a href="report.html"><i class="fa-solid fa-file-invoice"></i> Reports</a>
            <a href="manage_adminexam.html" class="active"><i class="fa-solid fa-file-circle-plus"></i> Exams</a>
            <a href="captured.html"><i class="fa-solid fa-camera"></i> Detections</a>
            
            <button onclick="openLogoutModal()" class="logout-btn">Logout</button>
        </div>
    </nav>

    <main>
        <section class="exam-list">
            <div style="margin-bottom: 20px;">
                <h2><i class="fa-solid fa-list"></i> Exams by Student</h2>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Exam Title</th>
                        <th>Student ID & Name</th>
                        <th>Date Created</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="examTableBody">
                </tbody>
            </table>
        </section>
    </main>

    <div id="logoutModal" class="modal">
        <div class="modal-content">
            <div class="card-header-modal">
                <h3><i class="fa-solid fa-right-from-bracket"></i> Are you sure you want to log out?</h3>
            </div>
            <div class="modal-body">
                <div class="modal-actions">
                    <button onclick="confirmLogout()" class="btn-confirm-logout">Logout</button>
                    <button onclick="closeLogoutModal()" class="btn-cancel">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/manage_adminexam.js"></script>
    <script>
        // --- Logout Modal Logic ---
        function openLogoutModal() {
            document.getElementById('logoutModal').style.display = 'flex';
        }

        function closeLogoutModal() {
            document.getElementById('logoutModal').style.display = 'none';
        }

        function confirmLogout() {
            localStorage.removeItem("formObj"); 
            localStorage.clear();
            window.location.href = "login.html";
        }

        // Close modal on outside click
        window.onclick = function(event) {
            const logoutModal = document.getElementById('logoutModal');
            if (event.target == logoutModal) {
                closeLogoutModal();
            }
        }
    </script>
</body>
</html>
