<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Exams - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/manage_adminexam.css">
</head>
<body>
    <header>
        <h1><i class="fa-solid fa-shield-halved"></i> Manage Exams</h1>
        <nav>
            <a href="dashboard.html"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
            <button onclick="logout()">Logout</button>
        </nav>
    </header>

    <main>
        <section class="exam-list">
            <h2><i class="fa-solid fa-list"></i> Exams by Student</h2>
            <table>
                <thead>
                    <tr>
                        <th>Exam Title</th>
                        <th>Student ID & Name</th>
                        <th>Date Created</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="examTableBody">
                    </tbody>
            </table>
        </section>
    </main>

    <script src="js/manage_adminexam.js"></script>
    <script>
        function logout() {
            if(confirm("Are you sure you want to log out?")){
                localStorage.removeItem("formObj"); 
                localStorage.clear();
                window.location.href = "login.html";
            }
        }
    </script>
</body>
</html>
