<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Results</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* --- NAVBAR & BUTTON STYLES (Fixing Layout) --- */
    .nav-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        background-color: #1e253f; /* Match dark theme */
        border-bottom: 1px solid #2d3748;
        color: white;
    }

    .nav-bar h1 {
        font-size: 20px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
    }

    .nav-buttons {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    /* Standard Nav Button */
    .btn-nav {
        background: transparent;
        color: #a0aec0;
        border: none;
        padding: 8px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s;
        text-decoration: none; /* In case it's an anchor */
    }

    .btn-nav:hover {
        color: #fff;
        background-color: rgba(255, 255, 255, 0.1);
    }

    /* User Menu Area */
    .user-menu {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-left: 15px;
        padding-left: 15px;
        border-left: 1px solid #4a5568;
    }

    #username {
        font-weight: 600;
        color: #e2e8f0;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* --- FIXED LOGOUT BUTTON --- */
    .btn-logout {
        background-color: #ef4444; /* Red */
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px; /* Space between icon and text */
        transition: background 0.2s;
    }

    .btn-logout:hover {
        background-color: #dc2626;
    }

    /* --- MODAL STYLES (Consistent) --- */
    .modal { 
        display: none; 
        position: fixed; 
        z-index: 2000; 
        left: 0; 
        top: 0; 
        width: 100%; 
        height: 100%; 
        background-color: rgba(0,0,0,0.6); 
        justify-content: center; 
        align-items: center; 
        backdrop-filter: blur(3px); 
    }
    
    .modal-content { 
        background-color: #fefefe; 
        margin: auto; 
        padding: 0; 
        border-radius: 8px; 
        width: 400px; 
        text-align: center; 
        position: relative; 
        overflow: hidden; 
        display: flex; 
        flex-direction: column; 
    }
    
    .card-header-modal { 
        background: #5840d8; 
        color: white; 
        padding: 20px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        width: 100%; 
    }
    
    .card-header-modal h3 { 
        margin: 0; 
        font-size: 18px; 
        font-weight: 600; 
        display: flex; 
        align-items: center; 
        gap: 10px; 
    }
    
    .modal-body { 
        padding: 25px; 
        width: 100%; 
        background: #fff; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
    }
    
    .modal-body p { 
        color: #4a5568; 
        font-size: 16px; 
        margin-bottom: 25px; 
        text-align: center; 
        width: 100%; 
    }
    
    .modal-actions { 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        gap: 15px; 
        width: 100%; 
        margin-top: 10px; 
    }
    
    /* Buttons - Centering Fix */
    .btn-confirm-logout { 
        background-color: #5840d8; 
        color: white; 
        border: none; 
        padding: 0; 
        border-radius: 6px; 
        cursor: pointer; 
        width: 130px; 
        height: 40px; 
        font-weight: 600; 
        font-size: 14px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        transition: background 0.2s; 
    }
    .btn-confirm-logout:hover { background-color: #4c35de; }

    .btn-cancel { 
        background-color: #6c757d; 
        color: white; 
        border: none; 
        padding: 0; 
        border-radius: 6px; 
        cursor: pointer; 
        width: 130px; 
        height: 40px; 
        font-weight: 600; 
        font-size: 14px; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        transition: background 0.2s; 
    }
    .btn-cancel:hover { background-color: #5a6268; }
  </style>
</head>
<body>
  
  <nav class="nav-bar">
    <h1><i class="fa-solid fa-chart-pie"></i> My Exam Results</h1>
    <div class="nav-buttons">
      <button onclick="location.href='available_exams.html'" class="btn-nav">
        <i class="fa-solid fa-file-pen"></i> Available Exams
      </button>
      
      <div class="user-menu">
        <span id="username"><i class="fa-solid fa-user-graduate"></i> Student</span>
        <button onclick="openLogoutModal()" class="btn-logout">
          <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="content-card">
      <div class="header-row">
        <h2><i class="fa-solid fa-file-signature"></i> Exam History</h2>
      </div>

      <div class="table-container">
        <table id="resultsTable">
          <thead>
            <tr>
              <th>Exam Title</th>
              <th>Exam ID</th>
              <th>Score</th>
              <th>Suspicious Acts</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="resultsBody">
            <tr><td colspan="5" class="placeholder">Loading results...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="logoutModal" class="modal">
    <div class="modal-content">
      <div class="card-header-modal">
        <h3><i class="fa-solid fa-right-from-bracket"></i> Confirm Logout</h3>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to log out?</p>
        <div class="modal-actions">
          <button onclick="confirmLogout()" class="btn-confirm-logout">Yes, Logout</button>
          <button onclick="closeLogoutModal()" class="btn-cancel">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/student.js"></script>
  <script>
    // --- Navbar Username Logic ---
    const username = localStorage.getItem('username') || 'Student';
    const usernameEl = document.getElementById('username');
    if (usernameEl) usernameEl.innerHTML = `<i class="fa-solid fa-user-graduate"></i> ${username}`;

    // --- Logout Modal Logic ---
    function openLogoutModal() { document.getElementById('logoutModal').style.display = 'flex'; }
    function closeLogoutModal() { document.getElementById('logoutModal').style.display = 'none'; }
    function confirmLogout() { localStorage.clear(); window.location.href = 'login.html'; }

    // Close modal on outside click
    window.onclick = function(event) {
      const logoutModal = document.getElementById('logoutModal');
      if (event.target == logoutModal) closeLogoutModal();
    }
  </script>
</body>
</html>
