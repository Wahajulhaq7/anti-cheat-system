<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Invigilator Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/invigilator.css" />
  
  <style>
    /* --- MODAL STYLES --- */
    .modal {
        display: none; 
        position: fixed;
        z-index: 2000; 
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6); 
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(3px); 
        display: flex; 
    }
    
    .modal-content {
        background-color: #fefefe;
        margin: auto;
        padding: 0;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        width: 400px; 
        text-align: center;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    
    .card-header-modal { 
        background: #5840d8; 
        color: white; 
        padding: 20px; 
        display: flex;
        justify-content: center; 
        align-items: center;     
        width: 100%;
    }

    .card-header-modal h3 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .modal-header-success {
        color: #28a745;
        font-size: 50px;
        margin-bottom: 10px;
        padding-top: 20px;
        display: flex;
        justify-content: center;
        width: 100%;
    }

    .modal-body { 
        padding: 25px; 
        text-align: center; 
        background: #fff; 
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
    }

    .modal-body p {
        color: #4a5568;
        font-size: 16px;
        margin-bottom: 25px;
        text-align: center;
        width: 100%;
    }

    .modal-actions {
        display: flex;
        justify-content: center; 
        align-items: center;
        gap: 15px; 
        width: 100%;
        margin-top: 10px;
    }
    
    /* Buttons */
    .btn-confirm-logout {
        background-color: #5840d8; 
        color: white;
        border: none;
        padding: 10px 0;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        width: 130px; 
        height: 40px; 
        display: flex;
        justify-content: center; 
        align-items: center;     
        transition: background 0.2s;
    }
    .btn-confirm-logout:hover { background-color: #4c35de; }

    .btn-cancel {
        background-color: #6c757d; 
        color: white;
        border: none;
        padding: 10px 0;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        width: 130px; 
        height: 40px; 
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background 0.2s;
    }
    .btn-cancel:hover { background-color: #5a6268; }
    
    .btn-ok {
        background-color: #28a745; 
        color: white;
        border: none;
        padding: 10px 0;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        width: 140px;
        height: 40px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .btn-ok:hover { background-color: #218838; }

  </style>
</head>
<body>
<nav class="nav-bar">
  <h1><i class="fa-solid fa-user-secret"></i> Invigilator Dashboard</h1>
  <div class="nav-buttons">
    <button onclick="location.href='students.html'" class="btn-nav">
      <i class="fa-solid fa-users"></i> Students
    </button>
    <button onclick="location.href='manage_exams.html'" class="btn-nav">
      <i class="fa-solid fa-file-lines"></i> Exams Created
    </button>
    <button onclick="location.href='submitted_exams.html'" class="btn-nav">
      <i class="fa-solid fa-clipboard-check"></i> Submitted Exams
    </button>
    <button onclick="location.href='invigilator_reports.html'" class="btn-nav">
      <i class="fa-solid fa-inbox"></i> Received Reports
    </button>
    <button onclick="location.href='unusual.html'" class="btn-nav">
      <i class="fa-solid fa-triangle-exclamation"></i> Unusual Detections
    </button>
    
    <div class="user-menu">
      <span id="username"><i class="fa-solid fa-user"></i> Invigilator</span>
      <button onclick="openLogoutModal()" class="btn-logout">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>
  </div>
</nav>

<div class="dashboard-container">
  <div class="stats-grid">
    <div class="stat-card">
      <h3>Total Students</h3>
      <p id="totalStudents">0</p>
    </div>
    <div class="stat-card">
      <h3>Ongoing Exams</h3>
      <p id="activeExamsCount">0</p>
    </div>
    <div class="stat-card">
      <h3>Total Exams Created</h3>
      <p id="totalExamsCreated">0</p>
    </div>
    <div class="stat-card warning">
      <h3>Suspicious Activities</h3>
      <p id="suspiciousCount">0</p>
    </div>
  </div>

  <section class="exam-section">
    <h2><i class="fa-solid fa-file-circle-plus"></i> Create MCQ Exam</h2>
    <form id="examForm">
      <div class="exam-header">
        <input type="text" id="examTitle" placeholder="Enter exam title" required>
      </div>

      <span class="time-section-title"><i class="fa-solid fa-hourglass-half"></i> Set Exam Duration</span>
      <div class="time-settings">
        <div class="time-group">
            <label><i class="fa-regular fa-clock"></i> Duration (Minutes)</label>
            <input type="number" id="examMinutes" min="1" placeholder="e.g. 60" value="30">
        </div>
      </div>

      <div id="questionsContainer"></div>
      
      <div class="form-actions">
        <button type="button" onclick="addQuestion()" class="btn-add-question">
          <i class="fa-solid fa-plus"></i> Add Question
        </button>
        <button type="submit" class="create-btn">
          <i class="fa-solid fa-check"></i> Create Exam
        </button>
      </div>
    </form>
  </section> 
</div>

<div id="logoutModal" class="modal" style="display: none;">
  <div class="modal-content">
    <div class="card-header-modal">
      <h3><i class="fa-solid fa-right-from-bracket"></i> Confirm Logout</h3>
    </div>
    <div class="modal-body">
      <p>Are you sure you want to log out?</p>
      <div class="modal-actions">
        <button onclick="confirmLogout()" class="btn-confirm-logout">Yes, Logout</button>
        <button onclick="closeLogoutModal()" class="btn-cancel">Cancel</button>
      </div>
    </div>
  </div>
</div>

<div id="successModal" class="modal" style="display: none;">
  <div class="modal-content">
    <div class="modal-header-success">
        <i class="fa-solid fa-circle-check"></i>
    </div>
    <div class="modal-body">
        <h3 style="margin: 0 0 10px; color: #333;">Success!</h3>
        <p id="successMessage" style="color:#666; margin-bottom: 20px;">Exam created successfully.</p>
        <div class="modal-actions">
            <button onclick="closeSuccessModal()" class="btn-ok">OK</button>
        </div>
    </div>
  </div>
</div>

<script src="js/invigilator.js"></script>

<script>
  // --- Logout Modal Logic ---
  function openLogoutModal() {
    document.getElementById('logoutModal').style.display = 'flex';
  }

  function closeLogoutModal() {
    document.getElementById('logoutModal').style.display = 'none';
  }

  function confirmLogout() {
    localStorage.clear();
    window.location.href = 'login.html';
  }

  // --- Success Modal Logic ---
  function openSuccessModal(message) {
    if(message) document.getElementById('successMessage').textContent = message;
    document.getElementById('successModal').style.display = 'flex';
  }

  function closeSuccessModal() {
    document.getElementById('successModal').style.display = 'none';
  }

  // Close modals on outside click
  window.onclick = function(event) {
    const logoutModal = document.getElementById('logoutModal');
    const successModal = document.getElementById('successModal');
    if (event.target == logoutModal) closeLogoutModal();
    if (event.target == successModal) closeSuccessModal();
  }
</script>

</body>
</html>
