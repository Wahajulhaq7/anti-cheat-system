<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="brand">
      <i class="fa-solid fa-shield-halved"></i> Anti-Cheat Exam System
    </div>
    <div class="nav-links">
      <a href="dashboard.html" class="active"><i class="fa-solid fa-gauge"></i> Dashboard</a>
      <a href="report.html"><i class="fa-solid fa-file-invoice"></i> Reports</a>
      <a href="manage_adminexam.html"><i class="fa-solid fa-file-circle-plus"></i> Exams</a>
      <a href="captured.html"><i class="fa-solid fa-camera"></i> Detections</a>
      <button onclick="logout()" class="logout-btn">Logout</button>
    </div>
  </nav>

  <div class="main-content">
    
    <div class="dashboard-banner">
      <h2><i class="fa-solid fa-gauge-high"></i> Admin Dashboard</h2>
      <p>Manage users, Manage exams, and monitor the system.</p>
    </div>

    <div class="section-header">
      <h4><i class="fa-solid fa-user-plus"></i> Quick Actions: Add User</h4>
    </div>
    
    <div class="action-card">
      <div class="input-row">
        <div class="form-group">
          <input type="text" id="newUsername" placeholder="Username" required>
        </div>

        <div class="form-group">
           <div class="input-wrapper">
             <input type="password" id="newPassword" placeholder="Password" required>
             <span class="password-toggle" onclick="togglePassword('newPassword')">
                <i class="fa-solid fa-eye"></i>
             </span>
           </div>
        </div>

        <div class="form-group">
          <select id="newRole">
            <option value="student">Student</option>
            <option value="admin">Admin</option>
            <option value="invigilator">Invigilator</option>
          </select>
        </div>

        <button onclick="addUser()" class="btn-create">
          <i class="fa-solid fa-plus"></i> Create User
        </button>
      </div>
    </div>

    <div class="table-container">
      <div class="table-header">
        <h3><i class="fa-solid fa-users"></i> All Users</h3>
      </div>

      <table id="usersTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Role</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

  </div>

  <div id="editUserModal" class="modal">
    <div class="modal-content">
      <div class="card-header-modal">
        <h3>Edit User</h3>
      </div>
      <div class="modal-body">
        <label>Username:</label>
        <input type="text" id="modalUsername">
        
        <label>Role:</label>
        <select id="modalRole">
           <option value="student">Student</option>
           <option value="admin">Admin</option>
           <option value="invigilator">Invigilator</option>
        </select>

        <label>New Password:</label>
        <div class="input-wrapper">
          <input type="password" id="modalPassword" placeholder="Leave blank to keep current">
          <span class="password-toggle" onclick="togglePassword('modalPassword')">
            <i class="fa-solid fa-eye"></i>
          </span>
        </div>
        
        <div class="modal-actions">
          <button onclick="saveUserFromModal()" class="btn-save">Save</button>
          <button onclick="closeModal()" class="btn-cancel">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
