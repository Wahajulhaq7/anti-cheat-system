# nginx.conf
events {
    worker_connections 1024;
}

http {
    # Use Docker's DNS resolver (127.0.0.11 is Docker's internal DNS)
    resolver 127.0.0.11 ipv6=off;

    # Optional: Set proxy timeout and buffer settings
    proxy_connect_timeout 30s;
    proxy_send_timeout   30s;
    proxy_read_timeout   30s;
    proxy_buffering      off;

    server {
        listen 80;

        # Serve static files
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ =404;
        }

        # Proxy API calls to FastAPI
        location /auth/ {
            set $upstream_backend http://backend:8000;
            proxy_pass $upstream_backend/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /exam/ {
            set $upstream_backend http://backend:8000;
            proxy_pass $upstream_backend/exam/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /video/feed {
            set $upstream_backend http://backend:8000;
            proxy_pass $upstream_backend/video/feed;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /health {
            set $upstream_backend http://backend:8000;
            proxy_pass $upstream_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}