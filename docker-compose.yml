# docker-compose.yml
version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: anticheat-sql-server
    environment:
      SA_PASSWORD: YourStrong@Pass123
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong@Pass123", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: anticheat-backend
    ports:
      - "8000:8000"
    environment:
      DB_SERVER: db
      DB_NAME: Anticheat
      DB_USER: sa
      DB_PASS: YourStrong@Pass123
    depends_on:
      - db
    volumes:
      - ./media/frames:/app/media/frames
    restart: on-failure

  frontend:
    image: nginx:alpine
    container_name: anticheat-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sql_data: